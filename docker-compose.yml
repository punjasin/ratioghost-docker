services:
  ratioghost:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: ratioghost
    container_name: ratioghost
    restart: unless-stopped
    ports:
      - "3773:3773"   # HTTP proxy
      - "3774:3774"   # HTTPS interception (listen port + 1)
    env_file:
      - .env
